name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/apps/calendandoLanding

            echo "📥 1. Actualizando código desde Git..."
            git fetch --all
            git reset --hard origin/main

            echo "🏗️ 2. Construyendo la nueva imagen Docker..."
            docker build -t calendando-landing:latest .

            echo "🛑 3. Deteniendo contenedor anterior..."
            docker stop calendando-landing || true
            docker rm calendando-landing || true

            echo "🚀 4. Desplegando nuevo contenedor..."
            docker run -d \
              --name calendando-landing \
              --restart unless-stopped \
              --env-file .env \
              -p 3005:3000 \
              calendando-landing:latest

            echo "🧹 5. Limpiando imágenes antiguas..."
            docker image prune -f

            echo "✅ ¡Despliegue completado con éxito!"